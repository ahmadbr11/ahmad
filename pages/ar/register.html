<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - MedLearn</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/pages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="../../index.html" class="logo">
                <span class="logo-icon"><i class="fas fa-graduation-cap"></i></span>
                <span class="logo-text">Med<span class="highlight">Learn</span></span>
            </a>
            <div class="nav-actions">
                <a href="../en/register.html" class="lang-switch">EN</a>
            </div>
        </div>
    </nav>

    <!-- Register Form -->
    <section class="auth-page">
        <div class="auth-container">
            <div class="auth-header">
                <a href="../../index.html" class="logo">
                    <span class="logo-icon"><i class="fas fa-graduation-cap"></i></span>
                    <span class="logo-text">Med<span class="highlight">Learn</span></span>
                </a>
                <h1>إنشاء حساب جديد</h1>
                <p>انضم لآلاف الأطباء في رحلة التعلم</p>
            </div>

            <form action="#" method="POST">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <div class="input-icon">
                        <input type="text" placeholder="أدخل اسمك الكامل" required>
                        <i class="fas fa-user"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <div class="input-icon">
                        <input type="email" placeholder="أدخل بريدك الإلكتروني" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>التخصص الطبي</label>
                    <select required>
                        <option value="">اختر تخصصك</option>
                        <option value="general">طب عام</option>
                        <option value="cardiology">أمراض القلب</option>
                        <option value="surgery">الجراحة</option>
                        <option value="pediatrics">طب الأطفال</option>
                        <option value="dentistry">طب الأسنان</option>
                        <option value="dermatology">الأمراض الجلدية</option>
                        <option value="radiology">الأشعة</option>
                        <option value="emergency">طب الطوارئ</option>
                        <option value="neurology">طب الأعصاب</option>
                        <option value="other">تخصص آخر</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>كلمة المرور</label>
                    <div class="input-icon">
                        <input type="password" placeholder="أدخل كلمة المرور" required>
                        <i class="fas fa-lock"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>تأكيد كلمة المرور</label>
                    <div class="input-icon">
                        <input type="password" placeholder="أعد إدخال كلمة المرور" required>
                        <i class="fas fa-lock"></i>
                    </div>
                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox" required> أوافق على <a href="terms.html">الشروط والأحكام</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">إنشاء حساب</button>
            </form>

            <div class="auth-divider">
                <span>أو</span>
            </div>

            <div class="social-login">
                <button class="social-btn google">
                    <i class="fab fa-google"></i>
                    Google
                </button>
                <button class="social-btn facebook">
                    <i class="fab fa-facebook-f"></i>
                    Facebook
                </button>
            </div>

            <div class="auth-footer">
                <p>لديك حساب بالفعل؟ <a href="login.html">سجل دخولك</a></p>
            </div>
        </div>
    </section>

    <script src="../../js/main.js"></script>
</body>
</html>
